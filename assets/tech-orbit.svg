    .halo { animation: halo 3s ease-out infinite; transform-origin: 320px 220px; transform-box: view-box; }
    @keyframes halo { 0% { transform: scale(1); opacity: .6; } 100% { transform: scale(1.8); opacity: 0; } }
  </style>
  <defs>
    <radialGradient id="bg" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#0B1F3A"/><stop offset="1" stop-color="#050B16"/></radialGradient>
    <linearGradient id="coreG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C6FF"/><stop offset="1" stop-color="#1769FF"/></linearGradient>
  </defs>
  <rect width="640" height="440" rx="18" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="638.5" height="438.5" rx="18" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>

  <circle cx="320" cy="220" r="100" fill="none" stroke="#1E3A5F" stroke-width="1.5" stroke-dasharray="4 6"/>
