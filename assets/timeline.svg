<svg xmlns="http://www.w3.org/2000/svg" width="960" height="250" viewBox="0 0 960 250">
  <style>
    .sans { font-family: 'Segoe UI', Ubuntu, 'Helvetica Neue', Arial, sans-serif; }
    .pop { opacity: 0; animation: pop .6s cubic-bezier(.2,.7,.2,1) forwards; }
    @keyframes pop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .ring { animation: ring 1.8s ease-out infinite; transform-origin: 850px 128px; transform-box: view-box; }
    @keyframes ring { 0% { transform: scale(1); opacity: .8; } 100% { transform: scale(2.4); opacity: 0; } }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#050B16"/><stop offset="1" stop-color="#0A1A33"/></linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3B5B85"/><stop offset=".5" stop-color="#1769FF"/><stop offset="1" stop-color="#00C6FF"/>
    </linearGradient>
  </defs>
  <rect width="960" height="250" rx="18" fill="url(#bg)"/>
  <rect x=".75" y=".75" width="958.5" height="248.5" rx="18" fill="none" stroke="#1E3A5F" stroke-width="1.5"/>
  <line x1="110.0" y1="128" x2="850.0" y2="128" stroke="#1B2B44" stroke-width="4" stroke-linecap="round"/>
  <line x1="110.0" y1="128" x2="850.0" y2="128" stroke="url(#track)" stroke-width="4" stroke-linecap="round" stroke-dasharray="740" stroke-dashoffset="740">
    <animate attributeName="stroke-dashoffset" from="740" to="0" begin=".2s" dur="3.0s" fill="freeze"/>
  </line>
  <!-- travelling spark that keeps the line alive after it is drawn -->
  <circle r="3" cy="128" fill="#FFFFFF" opacity="0">
    <animate attributeName="cx" from="110" to="850" begin="3.4s" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0;1;1;0" begin="3.4s" dur="2.5s" repeatCount="indefinite"/>
  </circle>
  <g class="sans">
  <g class="pop" style="animation-delay:0.20s">
    <circle cx="110.0" cy="128" r="9" fill="#07111F" stroke="#8B949E" stroke-width="2.5"/><circle cx="110.0" cy="128" r="4" fill="#8B949E"/>
    <line x1="110.0" y1="114" x2="110.0" y2="98" stroke="#8B949E" stroke-opacity=".5"/>
    <text x="110.0" y="70" text-anchor="middle" fill="#8B949E" font-size="11" font-weight="700" letter-spacing="1">2024</text>
    <text x="110.0" y="89" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">First steps</text>
    <text x="110.0" y="106" text-anchor="middle" fill="#8B949E" font-size="11.5">HTML &amp; web basics</text>
  </g>
  <g class="pop" style="animation-delay:0.70s">
    <circle cx="233.3" cy="128" r="9" fill="#07111F" stroke="#ED8B00" stroke-width="2.5"/><circle cx="233.3" cy="128" r="4" fill="#ED8B00"/>
    <line x1="233.3" y1="142" x2="233.3" y2="158" stroke="#ED8B00" stroke-opacity=".5"/>
    <text x="233.3" y="172" text-anchor="middle" fill="#ED8B00" font-size="11" font-weight="700" letter-spacing="1">2025</text>
    <text x="233.3" y="191" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Java &amp; DSA</text>
    <text x="233.3" y="208" text-anchor="middle" fill="#8B949E" font-size="11.5">Core CS foundations</text>
  </g>
  <g class="pop" style="animation-delay:1.20s">
    <circle cx="356.7" cy="128" r="9" fill="#07111F" stroke="#4FC08D" stroke-width="2.5"/><circle cx="356.7" cy="128" r="4" fill="#4FC08D"/>
    <line x1="356.7" y1="114" x2="356.7" y2="98" stroke="#4FC08D" stroke-opacity=".5"/>
    <text x="356.7" y="70" text-anchor="middle" fill="#4FC08D" font-size="11" font-weight="700" letter-spacing="1">EARLY 2026</text>
    <text x="356.7" y="89" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">spendX</text>
    <text x="356.7" y="106" text-anchor="middle" fill="#8B949E" font-size="11.5">Vue + Spring Boot app</text>
  </g>
  <g class="pop" style="animation-delay:1.70s">
    <circle cx="480.0" cy="128" r="9" fill="#07111F" stroke="#61DAFB" stroke-width="2.5"/><circle cx="480.0" cy="128" r="4" fill="#61DAFB"/>
    <line x1="480.0" y1="142" x2="480.0" y2="158" stroke="#61DAFB" stroke-opacity=".5"/>
    <text x="480.0" y="172" text-anchor="middle" fill="#61DAFB" font-size="11" font-weight="700" letter-spacing="1">MID 2026</text>
    <text x="480.0" y="191" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">React + TS</text>
    <text x="480.0" y="208" text-anchor="middle" fill="#8B949E" font-size="11.5">Blogs, Ecommers, PG app</text>
  </g>
  <g class="pop" style="animation-delay:2.20s">
    <circle cx="603.3" cy="128" r="9" fill="#07111F" stroke="#A78BFA" stroke-width="2.5"/><circle cx="603.3" cy="128" r="4" fill="#A78BFA"/>
    <line x1="603.3" y1="114" x2="603.3" y2="98" stroke="#A78BFA" stroke-opacity=".5"/>
    <text x="603.3" y="70" text-anchor="middle" fill="#A78BFA" font-size="11" font-weight="700" letter-spacing="1">AUG 2026</text>
    <text x="603.3" y="89" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Agentic AI</text>
    <text x="603.3" y="106" text-anchor="middle" fill="#8B949E" font-size="11.5">RAG from scratch</text>
  </g>
  <g class="pop" style="animation-delay:2.70s">
    <circle cx="726.7" cy="128" r="9" fill="#07111F" stroke="#EA1D2C" stroke-width="2.5"/><circle cx="726.7" cy="128" r="4" fill="#EA1D2C"/>
    <line x1="726.7" y1="142" x2="726.7" y2="158" stroke="#EA1D2C" stroke-opacity=".5"/>
    <text x="726.7" y="172" text-anchor="middle" fill="#EA1D2C" font-size="11" font-weight="700" letter-spacing="1">SEP 2026</text>
    <text x="726.7" y="191" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">GenAI</text>
    <text x="726.7" y="208" text-anchor="middle" fill="#8B949E" font-size="11.5">Doc version control + AI</text>
  </g>
  <g class="pop" style="animation-delay:3.20s">
    <circle cx="850.0" cy="128" r="9" fill="none" stroke="#00C6FF" stroke-width="2" class="ring" style="animation-delay:3.60s"/><circle cx="850.0" cy="128" r="9" fill="#07111F" stroke="#00C6FF" stroke-width="2.5"/><circle cx="850.0" cy="128" r="4" fill="#00C6FF"/>
    <line x1="850.0" y1="114" x2="850.0" y2="98" stroke="#00C6FF" stroke-opacity=".5"/>
    <text x="850.0" y="70" text-anchor="middle" fill="#00C6FF" font-size="11" font-weight="700" letter-spacing="1">OCT 2026</text>
    <text x="850.0" y="89" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">spritPOS</text>
    <text x="850.0" y="106" text-anchor="middle" fill="#8B949E" font-size="11.5">ERP with AI forecasting</text>
  </g>
  </g>
</svg>
