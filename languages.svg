<svg xmlns="http://www.w3.org/2000/svg" width="495" height="195" viewBox="0 0 495 195">
  <style>
    .grow { transform: scaleX(0); transform-origin: 28px 0; transform-box: view-box; animation: grow 1.2s cubic-bezier(.2,.7,.2,1) forwards; }
